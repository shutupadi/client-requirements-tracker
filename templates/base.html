<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Requirements Tracker{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
    header { background: #1f3a5f; color: #fff; padding: 12px 24px; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 14px; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #e5e7eb; }
    .APPROVED, .DONE { background: #d1fae5; } .CHANGES_REQUESTED { background: #fee2e2; } .IN_PROGRESS, .DRAFT { background: #fef3c7; }
    .msg { padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; background: #dbeafe; }
    .msg.error { background: #fee2e2; }
    button, .btn { background: #1f3a5f; color: #fff; border: 0; padding: 6px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
    pre { white-space: pre-wrap; background: #fafafa; padding: 12px; border: 1px solid #eee; border-radius: 6px; }
    form p { margin: 6px 0; } input, select, textarea { width: 100%; max-width: 420px; padding: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    .bar { background: #e5e7eb; border-radius: 6px; height: 10px; } .bar div { background: #10b981; height: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <header><a href="{% url 'project_list' %}">Requirements-to-Design Tracker</a></header>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
